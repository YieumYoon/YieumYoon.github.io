    Relevant Experience:
      - position: Advanced Manufacturing Engineer Co-op
        company: Bendix Commercial Vehicle Systems
        date: January 2026 - Present
        location: Avon, OH
        highlights:
          - Took Boston Dynamics Spot inspection from manual setup to production operation in a live factory. Configured approximately 500 inspection points, moving plant-wide collection from roughly every six months to daily or every-other-day autonomous operation.
          - Shipped eight field-used tools for Orbit run-history review, live sensor diagnostics, map validation, worker signaling, and alerts. Built map and inspection-point editing workflows that cut a full update from at least one person-week to within one workday while retaining human approval.
          - Built image- and log-rich alerts that cut incident discovery and response from as long as 12-24 hours to approximately 15-30 minutes; integrated Spot, GraphNav, Orbit APIs, Protocol Buffers, camera, depth, and robot-state data.
      - position: Weather AI Research Intern
        company: xLab at Case Western Reserve University | Progressive Insurance partner
        date: June 2025 - August 2025
        location: Cleveland, OH
        highlights:
          - Owned model execution and backend delivery on a three-student R&D team. Built a Python Earth2Studio/FourCastNet pipeline on six A6000 GPUs, generating seven-day forecasts in about three minutes and publishing NetCDF4 and preview outputs to AWS S3.
      - position: Frontend Developer, AI Call Center Training System
        company: xLab at Case Western Reserve University | Eaton partner
        date: January 2025 - May 2025
        location: Cleveland, OH
        highlights:
          - Built Next.js/TypeScript frontend components and integrated FastAPI API calls for an AI customer-simulation proof of concept designed to help call-center agents practice technical conversations with varied emotions and multilingual scenarios.
      - position: Squad Leader / IT Technician (Signaler)
        company: Republic of Korea Army
        date: January 2023 - July 2024
        location: South Korea
        highlights:
          - Improved CCTV field installation through bench-testing and preassembly, reducing on-site installation time by approximately 70%; trained a five-person team supporting more than 400 networked devices and 34 CCTV units while troubleshooting LAN and communications equipment.
    Projects:
      - name: Language-Guided Arm Selection on a Bimanual SO-101 with NVIDIA GR00T N1.5
        summary: Owned the core pipeline for a custom bimanual SO-101 embodiment, from three-camera teleoperation and dataset repair to training and physical evaluation. Re-recorded approximately 360 validated episodes totaling about 238,000 frames after diagnosing timestamp corruption. Fine-tuned GR00T N1.5 on H200/L40S GPUs, cut projected training time from about 15 hours to 2.5 hours, and reached approximately 25% full-task success across roughly 20 physical trials versus 0% untuned.
      - name: Local Qwen Inference and Observability System
        summary: Operate an always-on Ubuntu/RTX 5090 server for local Qwen inference via Codex/OpenCodex, llama-swap, and vLLM; AI handled most configuration after OS installation. Switch vLLM, ComfyUI, and WhisperX with one GPU-resident service at a time; ComfyUI/WhisperX run in Docker. Services restart after reboot; Tailscale enables remote access. Monitor GPU temperature/utilization/power, vLLM throughput/requests/KV cache, and CPU/RAM/disk in Grafana.
      - name: Spot Fiducial AprilTag Plate Generator
        summary: Built a public JavaScript/SVG tool for Spot localization tags; automated SVG-to-STEP conversion through Fusion 360, cutting per-tag CAD preparation from up to two hours to roughly 10 seconds across more than 120 plates.
      - name: Data Pipelines and Visualization
        summary: Built Python/SQL ELT workflows and six tested dbt analytical models; orchestrated an Airflow/PostgreSQL environmental-data pipeline with Tableau dashboards.
